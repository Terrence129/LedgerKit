[package]
name = "ledgerkit-desktop"
version = "1.0.0-beta.2"
description = "LedgerKit local-first personal finance desktop application"
authors = ["LedgerKit contributors"]
edition = "2024"
rust-version = "1.98"
license = "MIT"
default-run = "ledgerkit-desktop"

[lib]
name = "ledgerkit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
base64 = "=0.23.1"
calamine = "=0.36.1"
getrandom = "=0.4.3"
rfd = "=0.17.2"
rusqlite = { version = "=0.40.2", features = ["backup", "bundled"] }
rust_decimal = { version = "=1.42.1", default-features = false, features = ["std"] }
rust_xlsxwriter = "=0.99.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", default-features = false, features = ["common-controls-v6", "compression", "wry"] }
unicode-normalization = "=0.1.25"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"

[lints.rust]
elided_lifetimes_in_paths = "deny"
linker_messages = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
