[package]
name = "ledgerkit-tauri-spike"
version = "0.1.0"
description = "Disposable LedgerKit M1 Tauri vertical spike"
authors = ["LedgerKit contributors"]
edition = "2024"
rust-version = "1.98"
license = "MIT"
default-run = "ledgerkit-tauri-spike"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ledgerkit_tauri_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
aes-gcm = "=0.11.1"
argon2 = "=0.6.0"
base64 = "=0.23.1"
calamine = "=0.36.1"
getrandom = "=0.4.3"
rfd = { version = "=0.17.2", default-features = false }
rusqlite = { version = "=0.40.2", features = ["backup", "bundled", "functions"] }
rust_decimal = { version = "=1.42.1", default-features = false, features = ["serde", "std"] }
rust_xlsxwriter = "=0.99.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", default-features = false, features = ["common-controls-v6", "compression", "wry"] }
thiserror = "=2.0.20"
unicode-normalization = "=0.1.25"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
